# Install once per clone: `pip install -e .[dev]` then `pre-commit install`.
# Rules are configured in [tool.ruff] in pyproject.toml.
ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: pre-commit auto-fixes
  autoupdate_commit_msg: pre-commit autoupdate

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4  # the one place the ruff version is set; CI runs these hooks too
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
