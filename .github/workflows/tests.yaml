name: tests
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip packages
        env:
            MY_PRIVATE_REPO_TOKEN: ${{ secrets.MY_PRIVATE_REPO_TOKEN }}
        run: |
          pip install uv
          uv pip install --system -r tests/requirements.txt
          uv pip install --system -e .[dev]

      - name: Run tests with pytest
        run: pytest --cov --cov-report=xml

      # GitHub does not pass secrets to pull_request runs from forks, so
      # CODECOV_TOKEN is empty there and the action falls back to a tokenless
      # upload, which Codecov may reject. Only fail CI on upload errors when
      # the token is available (pushes and same-repo PRs).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
